model = "gpt-5.2"
model_reasoning_effort = "high"
web_search = "live"
suppress_unstable_features_warning = true

[features]
shell_snapshot = true
collab = true
collaboration_modes = true
apps = true
steer = true
personality = true

[sandbox_workspace_write]
network_access = true

# Context7 MCP server
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
